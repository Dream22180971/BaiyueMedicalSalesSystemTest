[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers -n auto
markers =
    smoke: 冒烟测试
    regression: 回归测试
    api: API接口测试
    customer: 客户管理测试
    medicine: 药品管理测试
    order: 订单管理测试
    login: 登录测试
filterwarnings =
    ignore::DeprecationWarning